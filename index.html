<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Save The Date — Taiane &amp; Ivan</title>

  <!-- Fontes do Google: Pinyon Script (letra cursiva), Great Vibes (só o "&") e Playfair Display (textos retos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="convite">

    <p class="data dourado" data-faisca>15 DE JULHO</p>
    <p class="hora dourado">ÀS 15h30</p>

    <h1 class="titulo dourado" data-faisca>
      <span class="linha">Save</span>
      <span class="linha">The Date</span>
    </h1>

    <p class="noivos dourado" data-faisca>
      Taiane <span class="e-comercial">&amp;</span> Ivan
    </p>

    <p class="local dourado">MEYER EVENTOS</p>
    <p class="endereco dourado">
      AV. OTACÍLIO NEGRÃO DE LIMA, 1969 -<br>
      SÃO LUIZ, BELO HORIZONTE
    </p>
  </main>

  <script src="script.js"></script>
